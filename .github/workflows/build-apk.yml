name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 34
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate pixel-art assets
        run: npm run assets

      - name: Generate app icons
        run: npm run icons

      - name: Run 2D engine tests
        run: npm run test:2d

      - name: Run 3D scene tests
        run: npm run test:3d

      - name: Run 3D end-to-end tests (jsdom)
        run: npm run e2e3d

      - name: Generate & patch Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
          npm run patch:android

      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align & Sign APK
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          "$BT/zipalign" -p -f 4 "$RAW" aligned.apk

          if ! "$BT/apksigner" sign \
            --ks android-keys/release.p12 \
            --ks-type PKCS12 \
            --ks-pass pass:horizon2026 \
            --key-pass pass:horizon2026 \
            --ks-key-alias horizonrp \
            --out signed.apk aligned.apk; then
            echo "Fallback: generating JKS keystore with keytool..."
            keytool -genkeypair -v -keystore fallback.keystore -alias horizonrp \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass horizon2026 -keypass horizon2026 \
              -dname "CN=Horizon RP, OU=Mobile, O=HorizonRP, L=Amsterdam, C=NL"
            "$BT/apksigner" sign \
              --ks fallback.keystore \
              --ks-pass pass:horizon2026 \
              --key-pass pass:horizon2026 \
              --ks-key-alias horizonrp \
              --out signed.apk aligned.apk
          fi

          "$BT/apksigner" verify --verbose signed.apk

      - name: Prepare APK file
        id: prep
        run: |
          mkdir -p apk-dist
          APK_NAME="VEXMORA-build${{ github.run_number }}.apk"
          cp signed.apk "apk-dist/$APK_NAME"
          ls -lh "apk-dist/$APK_NAME"
          echo "apk_path=apk-dist/$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEXMORA-apk-build${{ github.run_number }}
          path: ${{ steps.prep.outputs.apk_path }}

      # Теги сборок ведутся на стороне CI. Отдельная проверка позволяет
      # перезапустить упавшую публикацию, не создавая конфликт тегов.
      - name: Release tag availability
        id: reltag
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-build${{ github.run_number }}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Тег $TAG уже существует — публикация пропущена"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        if: steps.reltag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: VEXMORA · РЕМАСТЕР 3D-МОДЕЛЕЙ · Сборка ${{ github.run_number }}
          body: |
            ## 🗿 VEXMORA «РЕМАСТЕР 3D-МОДЕЛЕЙ» (Android APK, Сборка ${{ github.run_number }})

            Все существующие 3D-модели переработаны заново. Механики, управление, камера, боевая система, коллизии, физика и анимации **не менялись** — заменены сами модели, материалы и освещение.

            ### 🦌 Животные: анатомия вместо «коробки на палках»
            - У каждого зверя свой профиль скелета: длина корпуса, высота в холке, объём груди и крупа, посадка шеи, форма морды и ушей
            - **У лисы теперь собственный силуэт** — раньше она строилась тем же шаблоном, что волк, и имела идентичные габариты
            - **Исправлен баг**: живой мир передавал в модель только id, и все звери в игре строились ветвью «мелкое животное» — олень и медведь выглядели кроликом. Теперь модель получает полное описание вида
            - Появились лопатки, бёдра, суставы, светлое брюхо, грива, рога с отростками, клыки, борода, четыре типа ушей и три типа хвоста
            - Кролик и пустынная ящерица больше не одна модель: у кролика мощные задние лапы, усы и помпон-хвост, у ящерицы гребень, расставленные лапы и сегментированный хвост
            - Реальные пропорции: высота в холке 0.25–1.55 м, ноги строго на земле

            ### 🧟 Враги и боссы: каждый вид узнаваем
            - Гуманоиды собираются из общего скелета, но набор деталей считается **из id врага**: шлем с гребнем и нащёчниками, капюшон, борода, волосы, шрам, респиратор, наплечники с заклёпками, ранец со скаткой, патронташ, плащ, медицинский крест
            - Элита шире и тяжелее, бегуны и скелеты жилистые, гоблины ниже — комплекция тоже часть облика
            - **Владыка пепла переделан полностью**: раньше он попадал в ветку «элементаль» и отличался от рядового пепельного импа одним мешем. Теперь это отдельная модель — латная кираса, корона из шести зубцов, три глаза, плащ из пепла, двуручный меч с раскалённой кромкой и кружащие угольки (828 → 3286 трис)
            - Четвероногие хищники: грудная клетка, круп, холка, два сустава в лапах, когти, клыки, шипы по хребту у босса каньона
            - Големы — гранёные валуны с рунными жилами и кристаллами, гарпии — перьевые крылья из отдельных маховых перьев, призраки — многослойный саван с рваной кромкой и шлейфом, элементали — ядро, языки пламени и искры, дроны — гондолы, лопасти, подвес-пушка и антенна

            ### 🧝 Герой и оружие
            - Лицо: нос, надбровные дуги, скулы, уши, губы, подбородок; волосы прядями
            - Кисти с пальцами и большим пальцем, сапоги с подошвой и голенищем, подсумок, кольцо, клёпки и ребро жёсткости на нагруднике
            - Лук получил двойной изгиб, рожки, обмотку рукояти и гнёзда тетивы; посох — витое древко, кованые кольца и оправу-«когти»; клинки — дол, фаски и пятка у гарды
            - Детализация выросла вдвое (2444 → 5116 трис), но склейка по материалам держит число вызовов отрисовки на уровне 35 вместо 88

            ### 🏘 Мир: постройки и «живые» детали
            - Дома: каменная кладка со швами, угловые блоки, ставни с навесами, крыльцо со ступенями, конёк кровли, водосточные жёлоба
            - Крепости: кладка, бойницы, контрфорсы, каменная арка ворот, знамёна на башнях
            - Костры: зольная подушка, раскалённые угли, поленница и котелок на треноге
            - Деревья: корни-лапы, ветви второго порядка, до шести комков кроны; ели — мутовки голых веток; камни — сколы и мох; кусты — прутики и ягоды
            - Новые декоративные детали: цветы, грибы, щебень, костровища. Они инстансируются по ячейкам и рисуются только вблизи (32–70 м), физику не затрагивают

            ### 💡 Материалы и свет
            - 11 новых поверхностей: дерево, кованое железо, золото, кожа лица, мех, черепица, ткань, стекло, лёд, пепел, солома
            - Карты нормалей теперь у 12 поверхностей вместо 3 — камень, ткань, кожа, металл и мех перестали быть «залитыми»
            - **Добавлено окружение для отражений (IBL)**: небо и земля пересобираются в карту окружения при смене времени суток, металл, стекло и вода получают живые отражения. На слабых устройствах IBL не включается, полусферический свет компенсирует его отсутствие

            ### ⚡ Производительность
            - Склейка статической геометрии по материалам вынесена в общий модуль: дом — 14 вызовов отрисовки при 1438 трис, крепость — 10 при 1688, герой — 35 при 5116
            - Инстансинг и LOD сохранены: растительность нарезана по ячейкам 40 м, дальность отрисовки расширена под новую детализацию (деревья 190 м), мелкий декор — 32–70 м
            - Тени по-прежнему отсекаются по дальности: 420k → 31k трис во втором проходе
            - Мелкий декор не создаётся на низких настройках; на всех уровнях остаётся прирост FPS от динамического разрешения
            - Ни одного NaN в геометрии: проверено 51 модель, 64 672 трис суммарно

            ### ✅ Совместимость и контроль качества
            - Сохранения прежних версий совместимы; структура данных не менялась
            - Все анимации и узлы скелета на месте (hips, torso, head, armR/L, legR/L, legs, tail, wings) — проверено тестом
            - **32 комплексные проверки** движка, **91 проверка** 3D-сцен (добавлено 20 тестов ремастера), e2e-сценарии — всё зелёное в CI
            - Проверки фиксируют, что лиса не станет копией волка, босс не вернётся в ветку элементаля, а детализация останется в бюджете

          files: ${{ steps.prep.outputs.apk_path }}
          draft: false
          prerelease: false
