name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 34
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate pixel-art assets
        run: npm run assets

      - name: Generate app icons
        run: npm run icons

      - name: Run 2D engine tests
        run: npm run test:2d

      - name: Run 3D scene tests
        run: npm run test:3d

      - name: Run 3D end-to-end tests (jsdom)
        run: npm run e2e3d

      - name: Generate & patch Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
          npm run patch:android

      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align & Sign APK
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          "$BT/zipalign" -p -f 4 "$RAW" aligned.apk

          if ! "$BT/apksigner" sign \
            --ks android-keys/release.p12 \
            --ks-type PKCS12 \
            --ks-pass pass:horizon2026 \
            --key-pass pass:horizon2026 \
            --ks-key-alias horizonrp \
            --out signed.apk aligned.apk; then
            echo "Fallback: generating JKS keystore with keytool..."
            keytool -genkeypair -v -keystore fallback.keystore -alias horizonrp \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass horizon2026 -keypass horizon2026 \
              -dname "CN=Horizon RP, OU=Mobile, O=HorizonRP, L=Amsterdam, C=NL"
            "$BT/apksigner" sign \
              --ks fallback.keystore \
              --ks-pass pass:horizon2026 \
              --key-pass pass:horizon2026 \
              --ks-key-alias horizonrp \
              --out signed.apk aligned.apk
          fi

          "$BT/apksigner" verify --verbose signed.apk

      - name: Prepare APK file
        id: prep
        run: |
          mkdir -p apk-dist
          APK_NAME="VEXMORA-build${{ github.run_number }}.apk"
          cp signed.apk "apk-dist/$APK_NAME"
          ls -lh "apk-dist/$APK_NAME"
          echo "apk_path=apk-dist/$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEXMORA-apk-build${{ github.run_number }}
          path: ${{ steps.prep.outputs.apk_path }}

      # Теги сборок ведутся на стороне CI. Отдельная проверка позволяет
      # перезапустить упавшую публикацию, не создавая конфликт тегов.
      - name: Release tag availability
        id: reltag
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-build${{ github.run_number }}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Тег $TAG уже существует — публикация пропущена"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        if: steps.reltag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: VEXMORA · КОМПАКТНЫЙ ИНТЕРФЕЙС · Сборка ${{ github.run_number }}
          body: |
            ## 🎛 VEXMORA «ОПТИМИЗАЦИЯ ИГРОВОГО ИНТЕРФЕЙСА» (Android APK, Сборка ${{ github.run_number }})

            Кнопки больше не закрывают мир. Геймплей, управление персонажем, анимации, боевая система и транспорт **не менялись** — переработан только экранный интерфейс.

            ### 📐 Кнопки стали компактными
            - Основная атака: 104 → **74 px**, рывок/прыжок: 60 → **44 px**, лечение и защита: 52 → **38 px**
            - Джойстик: 138 → **96 px** — при этом площадка касаний осталась крупной, палец не «теряет» стик, а ход кнопки считается от её реального размера
            - Промежутки между кнопками уменьшены, способности собраны в аккуратную сетку **3×3**
            - Вся раскладка переведена с абсолютных смещений на **flex/grid** — кнопки физически не могут наехать друг на друга

            ### 🧭 Новое расположение
            - Джойстик — в левом нижнем углу
            - Боевые кнопки — в правом нижнем углу: рывок и прыжок сверху, тяжёлый удар и атака снизу
            - Лечение, зелья, блок, смена оружия и взаимодействие — отдельной компактной группой рядом с боем
            - Мини-карта — в правом верхнем углу, уменьшена до **84 px**, меню — вертикальной колонкой под ней
            - Информационная панель героя стала компактнее: меньше высоты, тоньше полосы, мельче чипы

            ### 🎨 Внешний вид и настройка прозрачности
            - Полупрозрачные кнопки с лёгким размытием фона — мир виден сквозь интерфейс
            - Стиль VEXMORA сохранён: те же тёплые акценты атаки, синие утилиты, зелёное взаимодействие
            - **Новая настройка «Прозрачность кнопок»**: Плотные / Обычные / Прозрачные / Минимальные (100–42%), сохраняется в профиле

            ### 📱 Адаптация под Android
            - Отдельные профили раскладки: широкий экран, узкий, низкий (горизонталь 360–412 dp), совсем узкий портрет
            - Учтены «чёлка» и скругления — отступы через safe-area
            - Автотест геометрии проверяет **10 разрешений** от 360×640 до 1920×1080: наложений нет ни на одном, управление занимает 4–22% экрана вместо почти половины
            - Центр экрана свободен: обзор мира ничем не перекрыт

            ### ✅ Совместимость
            - Все прежние кнопки и функции на месте: 9 способностей, лечение, зелья, блок, смена оружия, взаимодействие, рывок, прыжок, тяжёлый удар, 5 кнопок меню
            - 2D-режим без WebGL получил ту же компактную геометрию
            - Сохранения совместимы; новая настройка прозрачности подхватывается старыми профилями со значением по умолчанию

            ### 🧪 Контроль качества
            - **32 комплексные проверки** движка (добавлен тест компактного HUD), **71 проверка** 3D-сцен, e2e-сценарии — всё зелёное в CI
            - Прогон живого DOM: все 9 боевых кнопок, 9 способностей и 5 кнопок меню кликаются из новых групп

          files: ${{ steps.prep.outputs.apk_path }}
          draft: false
          prerelease: false
