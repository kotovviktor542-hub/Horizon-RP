name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 34
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate pixel-art assets
        run: npm run assets

      - name: Generate app icons
        run: npm run icons

      - name: Run 2D engine tests
        run: npm run test:2d

      - name: Run 3D scene tests
        run: npm run test:3d

      - name: Run 3D end-to-end tests (jsdom)
        run: npm run e2e3d

      - name: Generate & patch Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
          npm run patch:android

      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align & Sign APK
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          "$BT/zipalign" -p -f 4 "$RAW" aligned.apk

          if ! "$BT/apksigner" sign \
            --ks android-keys/release.p12 \
            --ks-type PKCS12 \
            --ks-pass pass:horizon2026 \
            --key-pass pass:horizon2026 \
            --ks-key-alias horizonrp \
            --out signed.apk aligned.apk; then
            echo "Fallback: generating JKS keystore with keytool..."
            keytool -genkeypair -v -keystore fallback.keystore -alias horizonrp \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass horizon2026 -keypass horizon2026 \
              -dname "CN=Horizon RP, OU=Mobile, O=HorizonRP, L=Amsterdam, C=NL"
            "$BT/apksigner" sign \
              --ks fallback.keystore \
              --ks-pass pass:horizon2026 \
              --key-pass pass:horizon2026 \
              --ks-key-alias horizonrp \
              --out signed.apk aligned.apk
          fi

          "$BT/apksigner" verify --verbose signed.apk

      - name: Prepare APK file
        id: prep
        run: |
          mkdir -p apk-dist
          APK_NAME="VEXMORA-build${{ github.run_number }}.apk"
          cp signed.apk "apk-dist/$APK_NAME"
          ls -lh "apk-dist/$APK_NAME"
          echo "apk_path=apk-dist/$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEXMORA-apk-build${{ github.run_number }}
          path: ${{ steps.prep.outputs.apk_path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: VEXMORA 3D · ГЛОБАЛЬНОЕ 3D-ОБНОВЛЕНИЕ · Сборка ${{ github.run_number }}
          body: |
            ## 🧊 VEXMORA 3D «ГЛОБАЛЬНОЕ ОБНОВЛЕНИЕ» (Android APK, Сборка ${{ github.run_number }})

            Вся игра переведена на three.js: тот же мир, тот же баланс, те же сохранения — но теперь в настоящем 3D. Если устройство не поддерживает WebGL, игра сама запускается в классическом 2D-режиме.

            - 🌄 **Мир стал объёмным**: весь континент 6400×6400 с высотами — леса, горы, ущелья, пустыни, снега, болота и мегаполис. Чанковый ландшафт с LOD, тысячи деревьев, кустов и скал, объёмная вода с волнами и бликами
            - 🌙 **Свет, тени и погода**: динамическое солнце и луна, 9 состояний неба, мягкие тени, туман, звёзды; ясно, дождь, гроза с молниями, снег и туман
            - 🗡 **Герой и бой в 3D**: модель с иерархией костей, бег, прыжок, блок, получение урона, комбо из трёх ударов; в руке меняются клинки, топоры, копья, кинжалы, луки и посохи, видны шлем, нагрудник и плащ; новая механика — ТЯЖЁЛЫЙ УДАР по площади
            - 👹 **Все 48 врагов и 23 босса** получили объёмные модели с процедурной анимацией и уникальным обликом; боссы крупнее, со свечением и аурой
            - ✨ **Эффекты**: след клинка, искры и кровь от попаданий, магические вспышки, кольца ударных волн, числа урона, пыль из-под ног
            - 🎛 **Новый 3D-интерфейс**: стик, кнопки боя, мини-карта с компасом и четыре пресета качества графики — низкий, средний, высокий и ультра
            - 📦 **Всё прежнее на месте**: квесты, фракции, база, спасение выживших, транспорт, артефакты, броня, испытания, магазины и крафт. Сохранения полностью совместимы
            - 🧪 **Автопроверки**: 28 проверок движка и 54 проверки 3D-сцен, моста «движок ↔ 3D», прогрессивных текстур и адаптивного разрешения проходят в CI при каждой сборке

          files: ${{ steps.prep.outputs.apk_path }}
          draft: false
          prerelease: false
