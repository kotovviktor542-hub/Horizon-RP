name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 34
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate pixel-art assets
        run: npm run assets

      - name: Generate app icons
        run: npm run icons

      - name: Run 2D engine tests
        run: npm run test:2d

      - name: Run 3D scene tests
        run: npm run test:3d

      - name: Run 3D end-to-end tests (jsdom)
        run: npm run e2e3d

      - name: Generate & patch Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
          npm run patch:android

      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align & Sign APK
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          "$BT/zipalign" -p -f 4 "$RAW" aligned.apk

          if ! "$BT/apksigner" sign \
            --ks android-keys/release.p12 \
            --ks-type PKCS12 \
            --ks-pass pass:horizon2026 \
            --key-pass pass:horizon2026 \
            --ks-key-alias horizonrp \
            --out signed.apk aligned.apk; then
            echo "Fallback: generating JKS keystore with keytool..."
            keytool -genkeypair -v -keystore fallback.keystore -alias horizonrp \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass horizon2026 -keypass horizon2026 \
              -dname "CN=Horizon RP, OU=Mobile, O=HorizonRP, L=Amsterdam, C=NL"
            "$BT/apksigner" sign \
              --ks fallback.keystore \
              --ks-pass pass:horizon2026 \
              --key-pass pass:horizon2026 \
              --ks-key-alias horizonrp \
              --out signed.apk aligned.apk
          fi

          "$BT/apksigner" verify --verbose signed.apk

      - name: Prepare APK file
        id: prep
        run: |
          mkdir -p apk-dist
          APK_NAME="VEXMORA-build${{ github.run_number }}.apk"
          cp signed.apk "apk-dist/$APK_NAME"
          ls -lh "apk-dist/$APK_NAME"
          echo "apk_path=apk-dist/$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEXMORA-apk-build${{ github.run_number }}
          path: ${{ steps.prep.outputs.apk_path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: VEXMORA · ОБНОВЛЕНИЕ OPEN WORLD · Сборка ${{ github.run_number }}
          body: |
            ## 🌍 VEXMORA «МАСШТАБНОЕ ОБНОВЛЕНИЕ OPEN WORLD» (Android APK, Сборка ${{ github.run_number }})

            Тот же герой, то же управление, та же камера и боевая система — но мир стал огромным и живым. Сохранения полностью совместимы.

            ### 🗺 Мир и исследование
            - **Карта 8000×8000** — вчетверо больше прежней, с плавными переходами между 13 биомами
            - **4 новых территории**: густая чаща, пепельные пустоши, древние руины, красный каньон — со своей флорой, палитрой и врагами
            - **22 руины, 26 достопримечательностей, 12 тайников, 9 пещер и 9 огромных полей** расставлены генератором исследования
            - **Пещеры стали аренами**: вход, волны врагов, лут в глубине и сохранение зачистки
            - **Руины обыскиваются**: монеты, кристаллы и шанс на Ключ-карту — один раз за место
            - Площадки исследования не зарастают лесом — достопримечательность видно издалека
            - **Карта мира** показывает руины, пещеры, тайники и поля, считает процент исследования и подсказывает ближайшее неоткрытое место

            ### 👹 Боссы и бой
            - **3 новых огромных босса**: Хранитель Врат «Терн» (каменные плиты и стражи), Пожиратель Каньона «Гресс» (рывки из-под земли и обвалы), Пепельный Государь «Кальдер» (дождь огня и огненные рывки)
            - У каждого **уникальная 3D-модель** (колосс, зверь, элементаль) и **три боевые фазы** с новыми приёмами
            - Название текущей фазы видно в HUD и в коллекции боссов
            - **3 новых оружия и 3 комплекта брони** в награду
            - Всего в игре **26 боссов** и **48 видов врагов**
            - Прежние механики на месте: контратаки после идеального уклонения, таранный рывок, 9 способностей (энергетический удар, удар по площади, замедление времени и другие)

            ### 🚗 Транспорт
            - **12 классов техники**: добавлены квадроцикл «Стрекоза», багги «Скарабей» и **катер «Волна»**
            - Катер держится на поверхности воды и ходит по глубине; обычный транспорт по-прежнему упирается в глубокую воду
            - У новой техники свои лёгкие 3D-модели — 510–580 треугольников против общего корпуса машины

            ### 🐺 Живой мир
            - Животные и странники на новых территориях, случайные встречи и события в разных частях карты

            ### ⚡ Производительность
            - LOD и подгрузка территорий: достопримечательности и трава полей включаются по радиусу
            - Кадр движка в открытом мире: **0.30 мс средний**, p95 — 0.6 мс на прогоне по всей карте с рывками и способностями
            - Спавн врагов, животных и снарядов ограничен по дальности

            ### 🧪 Контроль качества
            - **31 комплексная проверка** движка, **71 проверка** 3D-сцен и моста «движок ↔ 3D», e2e-сценарии — всё проходит в CI при каждой сборке
            - Отдельные тесты на исследование, пещеры, сохранения прогресса, фазы боссов и водный транспорт

          files: ${{ steps.prep.outputs.apk_path }}
          draft: false
          prerelease: false
