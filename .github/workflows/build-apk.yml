name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 34
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate pixel-art assets, icons & run tests
        run: npm run build:web

      - name: Generate & patch Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
          npm run patch:android

      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align & Sign APK
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          "$BT/zipalign" -p -f 4 "$RAW" aligned.apk

          if ! "$BT/apksigner" sign \
            --ks android-keys/release.p12 \
            --ks-type PKCS12 \
            --ks-pass pass:horizon2026 \
            --key-pass pass:horizon2026 \
            --ks-key-alias horizonrp \
            --out signed.apk aligned.apk; then
            echo "Fallback: generating JKS keystore with keytool..."
            keytool -genkeypair -v -keystore fallback.keystore -alias horizonrp \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass horizon2026 -keypass horizon2026 \
              -dname "CN=Horizon RP, OU=Mobile, O=HorizonRP, L=Amsterdam, C=NL"
            "$BT/apksigner" sign \
              --ks fallback.keystore \
              --ks-pass pass:horizon2026 \
              --key-pass pass:horizon2026 \
              --ks-key-alias horizonrp \
              --out signed.apk aligned.apk
          fi

          "$BT/apksigner" verify --verbose signed.apk

      - name: Prepare APK file
        id: prep
        run: |
          mkdir -p apk-dist
          APK_NAME="VEXMORA-build${{ github.run_number }}.apk"
          cp signed.apk "apk-dist/$APK_NAME"
          ls -lh "apk-dist/$APK_NAME"
          echo "apk_path=apk-dist/$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEXMORA-apk-build${{ github.run_number }}
          path: ${{ steps.prep.outputs.apk_path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: VEXMORA 2.0 · ПАДЕНИЕ ДРЕВНИХ · Сборка ${{ github.run_number }}
          body: |
            ## 🏰 VEXMORA 2.0 «ПАДЕНИЕ ДРЕВНИХ» (Android APK, Сборка ${{ github.run_number }})

            Масштабное расширение существующей 2D пиксельной Action-Survival RPG. Прогресс, стиль, управление и работающие механики сохранены; обновление Android ставится поверх прежней версии.

            - 👑 **10 особых территорий**: Пепельные земли, Затерянный лес, Ледяная пустошь, Королевство мёртвых, Бездна, Небесные руины, Подземное царство и Земли павших богов — тайлы, музыка, ловушки, сундуки и секреты
            - 👹 **20 боссов** с 3 фазами, телеграфами и интро, включая секретного финального ПАВШЕГО БОГА Азарота; награды — легендарное оружие и 6 комплектов брони
            - 🏳️ **5 фракций и репутация**, сюжетная развилка Рассвет/Ковен, фракционные магазины, испытания арен и 4 ветки перков (Воин/Ассасин/Маг/Страж)
            - ⚔️ **48 видов оружия**, уязвимости стихий (+35% урона), 40 типов врагов и режим повышенной сложности после финала; старые сохранения совместимы
            - 🌌 **3 новые локации**: Забытые Руины, Лес Проклятых и Крепость Бездны — ловушки, сундуки, проклятые сундуки с засадами, секретные бункеры и Кристаллы Бездны
            - 👹 **5 новых боссов (всего 15)** с 3 фазами, телеграфами атак и кинематографичными интро, включая секретное СЕРДЦЕ БЕЗДНЫ; награды — легендарное оружие и 6 артефактов Бездны
            - 🔥 **Новые способности**: Огненный Удар, Ледяной Взрыв и Теневой Телепорт; характеристика Магия; 6 новых видов оружия (всего 30) с поджогом, замедлением и вампиризмом
            - 🆘 **3 новых спасения (всего 13)**: Историк Рун, Травница (+15% лечения) и Кузнец Горн со скидкой Кузницы −25%; случайные события мира и элитные враги с редкой добычей
            - 👾 **16 уникальных типов врагов** с особым ИИ: снайперы с лазерным прицелом, невидимые охотники, гренадёры, огнемётчики, кислотные мутанты, боевые дроны, вражеские медики и мини-боссы охраны
            - 👹 **10 многофазных боссов с аренами и телеграфами атак**: от Короля Мутантов и Огромного Боевого Робота до финального АРХОНТА VEXMORA, коллекция трофеев и открытие новых территорий
            - 🔫 **Арсенал из 24 видов оружия** с магазинами, перезарядкой, постепенным открытием, прокачкой +10 и 5 боевыми модификациями у Инженера
            - 🆘 **Спасение 10 пленников и выживших**: клетки и сигнализация, защита от волн врагов, сопровождение караванов и спасение на время
            - 🏰 **Развитие Убежища**: Медик, Торговец, Инженер, Механик и боец-напарник Сержант Шрам; 5 прокачиваемых отсеков базы
            - 🎯 **Спецоперации**: зачистка баз, охота на командиров, охрана караванов, поиск редкого оружия и отражения штурмов Убежища
            - 🎨 Чёткий пиксель-арт без размытия, отдельные прозрачные PNG-объекты и спрайт-листы, 100% офлайн, оптимизация для слабых Android-телефонов

          files: ${{ steps.prep.outputs.apk_path }}
          draft: false
          prerelease: false
