name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 34
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate pixel-art assets
        run: npm run assets

      - name: Generate app icons
        run: npm run icons

      - name: Run 2D engine tests
        run: npm run test:2d

      - name: Run 3D scene tests
        run: npm run test:3d

      - name: Run 3D end-to-end tests (jsdom)
        run: npm run e2e3d

      - name: Generate & patch Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
          npm run patch:android

      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align & Sign APK
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          "$BT/zipalign" -p -f 4 "$RAW" aligned.apk

          if ! "$BT/apksigner" sign \
            --ks android-keys/release.p12 \
            --ks-type PKCS12 \
            --ks-pass pass:horizon2026 \
            --key-pass pass:horizon2026 \
            --ks-key-alias horizonrp \
            --out signed.apk aligned.apk; then
            echo "Fallback: generating JKS keystore with keytool..."
            keytool -genkeypair -v -keystore fallback.keystore -alias horizonrp \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass horizon2026 -keypass horizon2026 \
              -dname "CN=Horizon RP, OU=Mobile, O=HorizonRP, L=Amsterdam, C=NL"
            "$BT/apksigner" sign \
              --ks fallback.keystore \
              --ks-pass pass:horizon2026 \
              --key-pass pass:horizon2026 \
              --ks-key-alias horizonrp \
              --out signed.apk aligned.apk
          fi

          "$BT/apksigner" verify --verbose signed.apk

      - name: Prepare APK file
        id: prep
        run: |
          mkdir -p apk-dist
          APK_NAME="VEXMORA-build${{ github.run_number }}.apk"
          cp signed.apk "apk-dist/$APK_NAME"
          ls -lh "apk-dist/$APK_NAME"
          echo "apk_path=apk-dist/$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEXMORA-apk-build${{ github.run_number }}
          path: ${{ steps.prep.outputs.apk_path }}

      # Теги сборок ведутся на стороне CI. Отдельная проверка позволяет
      # перезапустить упавшую публикацию, не создавая конфликт тегов.
      - name: Release tag availability
        id: reltag
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-build${{ github.run_number }}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Тег $TAG уже существует — публикация пропущена"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        if: steps.reltag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: VEXMORA · СТАБИЛЬНОСТЬ 3D · Сборка ${{ github.run_number }}
          body: |
            ## 🛠 VEXMORA «СТАБИЛЬНОСТЬ 3D НА ТЕЛЕФОНАХ» (Android APK, Сборка ${{ github.run_number }})

            Исправления поверх ремастера 3D-моделей. Внешний вид, механики и баланс не менялись — только устранены случаи, когда 3D-режим мог не запуститься или подтормаживать на слабом железе.

            ### 🐞 Главное: 3D-режим больше не падает без 2D-канваса
            - Браузер на телефоне ограничивает число одновременных 2D-канвасов (в Chrome — около 60 на страницу). При исчерпании лимита `getContext('2d')` возвращает `null` — и раньше в этом месте ломался весь 3D-режим
            - Падала **модель героя**: тень-пятно под ногами строилась без проверки контекста, исключение прерывало сборку модели, а следом и инициализацию мира
            - Теперь без контекста 3D просто рисуется без второстепенных деталей: герой собирается полностью (36 мешей), тень заменяется штатной
            - То же самое закрыто ещё в четырёх местах: карта детализации рельефа, всплывающие числа урона, подписи руин и мини-карта — ни одно из них больше не роняет кадр и не мешает играть
            - Подписи и текстуры остаются необязательными: если 2D-канвас недоступен, игра работает без них

            ### ⚡ Плавность на средних настройках
            - Карта окружения для отражений (IBL) теперь пересобирается только на «Высоком» и «Ультра» качестве. На «Низком» и «Среднем» её отключаем — там важнее ровный кадр, а объём сцены даёт полусферический свет
            - Пересчёт окружения стал вдвое реже: порог изменения времени суток поднят с 0.01 до 0.02 игровых суток (≈5 секунд реального времени), микро-подвисания при смене освещения ушли

            ### 🧪 Контроль качества
            - **94 проверки** 3D-сцен (добавлены три регрессионных: работа без 2D-контекста, сборка героя, построение рельефа)
            - **32 комплексные проверки** движка и e2e-сценарии — всё зелёное в CI
            - Проверки специально эмулируют «кончившийся» 2D-контекст, чтобы эта ошибка не вернулась

            ### 🗿 Всё из ремастера моделей на месте
            - Животные с собственной анатомией (у лисы свой силуэт, кролик и ящерица — разные модели), уникальный «Владыка пепла» (3286 трис), детальные гуманоиды и големы
            - Герой с лицом и пальцами, новое оружие, постройки с кладкой и бойницами, мелкий декор (цветы, грибы, щебень)
            - 11 новых поверхностей, карты нормалей у 12 материалов, склейка статики по материалам

            ### ✅ Совместимость
            - Сохранения прежних версий совместимы; структура данных не менялась
            - Анимации и узлы скелета не затронуты

          files: ${{ steps.prep.outputs.apk_path }}
          draft: false
          prerelease: false
