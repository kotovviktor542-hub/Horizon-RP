name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 34
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate pixel-art assets, icons & run tests
        run: npm run build:web

      - name: Generate & patch Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
          npm run patch:android

      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align & Sign APK
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          "$BT/zipalign" -p -f 4 "$RAW" aligned.apk

          if ! "$BT/apksigner" sign \
            --ks android-keys/release.p12 \
            --ks-type PKCS12 \
            --ks-pass pass:horizon2026 \
            --key-pass pass:horizon2026 \
            --ks-key-alias horizonrp \
            --out signed.apk aligned.apk; then
            echo "Fallback: generating JKS keystore with keytool..."
            keytool -genkeypair -v -keystore fallback.keystore -alias horizonrp \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass horizon2026 -keypass horizon2026 \
              -dname "CN=Horizon RP, OU=Mobile, O=HorizonRP, L=Amsterdam, C=NL"
            "$BT/apksigner" sign \
              --ks fallback.keystore \
              --ks-pass pass:horizon2026 \
              --key-pass pass:horizon2026 \
              --ks-key-alias horizonrp \
              --out signed.apk aligned.apk
          fi

          "$BT/apksigner" verify --verbose signed.apk

      - name: Prepare APK file
        id: prep
        run: |
          mkdir -p apk-dist
          APK_NAME="HorizonRP-build${{ github.run_number }}.apk"
          cp signed.apk "apk-dist/$APK_NAME"
          ls -lh "apk-dist/$APK_NAME"
          echo "apk_path=apk-dist/$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorizonRP-apk-build${{ github.run_number }}
          path: ${{ steps.prep.outputs.apk_path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Horizon RP · Сборка ${{ github.run_number }}
          body: |
            ## ⚔️ Horizon: Выживание (Pixel-Art Edition) — Android APK (Сборка ${{ github.run_number }})

            Полноценная 2D пиксель-арт экшен-выживание RPG для телефонов Android:
            - 🎨 **Единый чёткий пиксель-арт стиль** (`16×16` / `32×32`) с тёмными контурами, текстурами и многокадровыми спрайт-листами без размытия (`imageSmoothingEnabled = false`)
            - 🏃 **Главный герой с покадровой анимацией**: 4 направления ходьбы, бег, прыжок, атака, получение урона, рюкзак и отображение любого экипированного оружия в руках
            - 🔫 **8 видов оружия** (Пистолет, Дробовик, Автомат, Снайперка, Нож, Меч, Лук, Посох Магии) + патроны, осколочные гранаты, аптечки, еда, зелья, монеты, ключи и прокачка рюкзака
            - 🏢 **9 типов зданий с точными AABB-коллизиями и входами** (Дом, Магазин `SHOP`, Склад, Бункер с замком под Ключ, Вышка, Завод, Больница, Полиция, Военная База)
            - 🚗 **6 видов транспорта** (управляемые Мотоцикл, Машина и Внедорожник с тараном врагов + Автобус, Вертолёт и Лодка)
            - 💀 **Зомби, мародёры, бойцы спецотряда, мутанты, 4 NPC и 4 Босса** + пиксельные эффекты взрывов, выстрелов, магии, ударов, дыма и воды
            - 📱 Работает **100% офлайн**, оптимизировано для слабых Android-смартфонов.
          files: ${{ steps.prep.outputs.apk_path }}
          draft: false
          prerelease: false
